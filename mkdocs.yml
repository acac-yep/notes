site_name: 学习资料库
site_url: https://acac-yep.github.io/notes/
site_description: 考试速通资料与论文精读笔记
site_author: 王子涵
repo_url: https://github.com/acac-yep/notes
repo_name: acac-yep/notes
edit_uri: edit/main/docs/
copyright: © 2026 王子涵 · 用 Material for MkDocs 构建

theme:
  name: material
  language: zh
  font: false            # 不拉 Google Fonts，国内访问更稳
  icon:
    logo: material/book-open-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - 首页: index.md
  - 考试速通:
      - exam/index.md
      - CS336 语言模型: exam/cs336.md
  - 论文笔记:
      - papers/index.md
      - 推荐系统:
          - papers/recsys/index.md
          - AgentX（2606.26859）: papers/recsys/2606.26859-agentx.md
          - NOVA（2606.27243）: papers/recsys/2606.27243-nova.md
          - Astar（2608.27287）: papers/recsys/2608.27287-astar.md
  - 关于: about.md

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/mermaid.js
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js

extra_css:
  - stylesheets/extra.css
