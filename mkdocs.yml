site_name: 学习资料库
site_url: https://acac-yep.github.io/notes/
site_description: 考试速通资料与论文精读笔记
site_author: 王子涵
repo_url: https://github.com/acac-yep/notes
repo_name: acac-yep/notes
edit_uri: edit/main/docs/
copyright: © 2026 王子涵 · 用 Material for MkDocs 构建

theme:
  name: material
  language: zh
  font: false            # 不拉 Google Fonts，国内访问更稳
  icon:
    logo: material/book-open-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - 首页: index.md
  - 考试速通:
      - exam/index.md
      - CS336 语言模型: exam/cs336.md
      - 算法基础: exam/algorithms.md
      - 计算机网络: exam/networking.md
      - 编译原理:
          - 00-学习路线与课程地图: exam/compiler/00-学习路线与课程地图.md
          - 01-引论: exam/compiler/01-引论.md
          - 02-词法分析: exam/compiler/02-词法分析.md
          - 03-语法分析: exam/compiler/03-语法分析.md
          - 04-语法制导翻译: exam/compiler/04-语法制导翻译.md
          - 05-类型检查: exam/compiler/05-类型检查.md
          - 06-运行时存储空间的组织和管理: exam/compiler/06-运行时存储空间的组织和管理.md
          - 07-中间代码生成: exam/compiler/07-中间代码生成.md
          - 08-代码生成: exam/compiler/08-代码生成.md
          - 09-独立于机器的优化: exam/compiler/09-独立于机器的优化.md
          - 10-依赖于机器的优化: exam/compiler/10-依赖于机器的优化.md
          - 11-编译系统和运行时系统: exam/compiler/11-编译系统和运行时系统.md
          - 12-面向对象语言的编译: exam/compiler/12-面向对象语言的编译.md
          - 13-函数式语言的编译: exam/compiler/13-函数式语言的编译.md
          - 99-考前总复习: exam/compiler/99-考前总复习.md
  - 论文笔记:
      - papers/index.md
      - 推荐系统:
          - papers/recsys/index.md
          - 2602.10226-self-evolving-youtube: papers/recsys/2602.10226-self-evolving-youtube.md
          - 2602.12612-self-evolverec: papers/recsys/2602.12612-self-evolverec.md
          - 2606.26859-agentx: papers/recsys/2606.26859-agentx.md
          - 2606.27243-nova: papers/recsys/2606.27243-nova.md
          - 2606.28368-evorec: papers/recsys/2606.28368-evorec.md
          - 2607.29241-recharness: papers/recsys/2607.29241-recharness.md
          - 2608.27287-astar: papers/recsys/2608.27287-astar.md
          - 2609.10922-auto-recsys: papers/recsys/2609.10922-auto-recsys.md
          - 2609.30001-agentx-model: papers/recsys/2609.30001-agentx-model.md
  - 关于: about.md

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/mermaid.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js

extra_css:
  - stylesheets/extra.css
